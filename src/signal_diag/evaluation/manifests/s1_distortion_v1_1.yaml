  # THD-at-boundary rows inject second-harmonic ratio 0.04999999 (not 0.05) so
  # measured THD is ~4.9999993522848%, satisfying gte 4.999, lte 5.001, and the
  # stacked rule condition lte 5.0. Causal harmonic_distortion remains present.
  - case_id: case_v11_dev_harmonic_boundary
    split: development
    category: harmonic
    user_request: Explain what is making this periodic signal sound distorted.
    signal:
      generator: harmonic_sine
      fundamental_hz: 200.0
      sample_rate_hz: 48000
      duration_s: 2.0
      fundamental_amplitude: 0.48
      harmonic_ratios:
        - order: 2
          ratio: 0.04999999
    causal_faults: [harmonic_distortion]
    observable_conditions:
      - condition_id: cond_v11_dev_harmonic_boundary_clipping_detected
        tool_name: detect_clipping
        metric: clipping_detected
        validity: valid
        comparator: eq
        expected_value: false
      - condition_id: cond_v11_dev_harmonic_boundary_harmonic_valid
        tool_name: analyze_harmonic_distortion
        metric: valid
        validity: valid
        comparator: eq
        expected_value: true
        supports_claims: [harmonic_distortion]
      - condition_id: cond_v11_dev_harmonic_boundary_thd_lo
        tool_name: analyze_harmonic_distortion
        metric: thd_percent
        validity: valid
        comparator: gte
        expected_value: 4.999
        unit: "%"
        supports_claims: [harmonic_distortion]
      - condition_id: cond_v11_dev_harmonic_boundary_thd_hi
        tool_name: analyze_harmonic_distortion
        metric: thd_percent
        validity: valid
        comparator: lte
        expected_value: 5.001
        unit: "%"
        supports_claims: [harmonic_distortion]
      - condition_id: cond_v11_dev_harmonic_boundary_thd
        tool_name: analyze_harmonic_distortion
        metric: thd_percent
        validity: valid
        comparator: lte
        expected_value: 5.0
        unit: "%"
        supports_claims: [harmonic_distortion]
    acceptable_first_tools: [detect_clipping, analyze_harmonic_distortion]
    sufficient_evidence_sets:
      - evidence_set_id: evset_v11_dev_harmonic_boundary_thd
        condition_refs:
          - cond_v11_dev_harmonic_boundary_harmonic_valid
          - cond_v11_dev_harmonic_boundary_thd_lo
          - cond_v11_dev_harmonic_boundary_thd_hi
          - cond_v11_dev_harmonic_boundary_thd
        supported_claims: [harmonic_distortion]
        acceptable_outcomes: [supported_fault]
      - evidence_set_id: evset_v11_dev_harmonic_boundary_clipping_absent_thd
        condition_refs:
          - cond_v11_dev_harmonic_boundary_clipping_detected
          - cond_v11_dev_harmonic_boundary_harmonic_valid
          - cond_v11_dev_harmonic_boundary_thd_lo
          - cond_v11_dev_harmonic_boundary_thd_hi
          - cond_v11_dev_harmonic_boundary_thd
        supported_claims: [harmonic_distortion]
        acceptable_outcomes: [supported_fault]
    knowledge_policy: optional
