    split: development
    category: clean
    user_request: Diagnose this signal for clipping and harmonic distortion.
    signal:
      generator: sine
      frequency_hz: 200.0
      sample_rate_hz: 48000
      duration_s: 2.0
      amplitude: 0.50
      phase_rad: 0.0
      dc_offset: 0.0
    causal_faults: []
    observable_conditions:
      - condition_id: cond_dev_clean_01_clipping_detected
        tool_name: detect_clipping
        metric: clipping_detected
        validity: valid
        comparator: eq
        expected_value: false
        supports_claims: [no_supported_fault]
      - condition_id: cond_dev_clean_01_clipping_ratio
        tool_name: detect_clipping
        metric: clipping_ratio
        validity: valid
        comparator: lte
        expected_value: 0.01
        supports_claims: [no_supported_fault]
      - condition_id: cond_dev_clean_01_flat_top
        tool_name: detect_clipping
        metric: flat_top_detected
        validity: valid
        comparator: eq
        expected_value: false
        supports_claims: [no_supported_fault]
      - condition_id: cond_dev_clean_01_harmonic_valid
