[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-diagnosis-agent"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.7,<3",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
app = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.9,<1",
]
llm = [
  "openai>=1.0",
]
dev = [
  "build>=1.2",
  "httpx>=0.27,<1",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "mypy>=1.10",
  "types-PyYAML>=6.0.12",
]

[project.scripts]
signal-diag = "signal_diag.app.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"signal_diag.app" = ["static/*.html", "static/*.css", "static/*.js"]
"signal_diag.evaluation" = ["manifests/*.yaml", "assets/*.json"]
"signal_diag.knowledge" = ["corpus/*.md"]
"signal_diag.rules" = ["profiles/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
asyncio_mode = "auto"
